[package]
name = "open-rock"
version = "0.1.1"
description = "Open Rock: chat with AWS Bedrock models or the models on your own servers"
edition = "2021"
rust-version = "1.77"

[lib]
name = "open_rock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
getrandom = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
